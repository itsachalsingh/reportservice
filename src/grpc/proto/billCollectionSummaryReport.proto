  double total_advance_used = 66;
  double total_advance_used_paise = 67;
  double total_advance_used_rounded_rupees = 68;
}

message BillCollectionSummaryResponse {
  bool success = 1;
  string message = 2;
  BillCollectionSummaryFilters filters = 3;
  BillCollectionSummaryData data = 4;
}
